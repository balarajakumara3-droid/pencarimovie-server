name: Sync fork
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: gh repo sync ${{ github.repository }} --source aiskendi/pencarimovie-server --branch main
        env:
          GH_TOKEN: ${{ github.token }}
